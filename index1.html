<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style1.css">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <p class="header__start">
                Sign up and get 20% off to your first order.<a href="#" class="Sign_Up_Now">Sign Up Now</a>
            </p>
            <a class="header__cross" href="#0">x</a>
        </div>
    </header>
    <main>
        <section class="section__one">
            <div class="section__one-container">
                <h1>SHOP.CO</h1>
                <nav>
                    <ul>
                        <li><a href="#0">Shop<img class="check__mark" src="./images/downward arrow.svg"></a></li>
                        <li><a href="#0">On Sale</a></li>
                        <li><a href="#0">New Arrivals</a></li>
                        <li><a href="#0">Brands</a></li>
                    </ul>
                </nav>
                <div class="search-wrapper">
                    <img class="search-icon" src="./images/magnifier.svg">
                    <input class="search" type="text" placeholder="Search for products...">
                </div>
                <div class="main__icons">
                    <a href="#0"><img src="./images/basket.svg"></a>
                    <a href="#0"><img src="./images/profile.svg"></a>
                </div>
            </div>
        </section>
        <section class="section__two">
            <div class="section__two-container_line">
                <hr class="section__two-line">
            </div>
            <div class="section__two-navigation_chain">
                <p>Home</p>
                <p>></p>
                <p>Casual</p>
            </div>
            <div class="section__two-container">
                <div class="section__two-filter">
                    <h3>Filters</h3>
                    <img src="./images/filter.svg">
                </div>
                <hr class="section__two-filter_line">
                <div class="section__two-filter_common">
                    <div class="section__two-filter_catalog">
                        <div class="section__two-filter_clothes">
                            <p class="section__two-filter_title">T-shirts</p>
                            <p>></p>
                        </div>
                        <div class="section__two-filter_clothes">
                            <p class="section__two-filter_title">Shorts</p>
                            <p>></p>
                        </div>
                        <div class="section__two-filter_clothes">
                            <p class="section__two-filter_title">Shirts</p>
                            <p>></p>
                        </div>
                        <div class="section__two-filter_clothes">
                            <p class="section__two-filter_title">Hoodie</p>
                            <p>></p>
                        </div>
                        <div class="section__two-filter_clothes">
                            <p class="section__two-filter_title">Jeans</p>
                            <p>></p>
                        </div>
                    </div>
                    <hr class="section__two-filter_line">
                    <div class="section__two-filter_Price-common">
                        <div class="section__two-filter_Price">
                            <p>Price</p>
                            <img src="./images/up arrow.svg">
                        </div>
                    </div>
                    <hr class="section__two-filter_line">
                    <div class="section__two-filter_colors-common">
                        <div class="section__two-filter_colors">
                            <p>Colors</p>
                            <img src="./images/up arrow.svg">
                        </div>
                    </div>
                    <hr class="section__two-filter_line">
                    <div class="section__two-filter_Size-common">
                        <div class="section__two-filter_Size">
                            <p>Size</p>
                            <img src="./images/up arrow.svg">
                        </div>
                        <div class="section__one-container_Size">
                            <!-- <p>XX-Small</p>
                            <p>X-Small</p>
                            <p>Small</p>
                            <p>Medium</p>
                            <p>Large</p>
                            <p>X-Large</p>
                            <p>XX-Large</p>
                            <p>3X-Large</p>
                            <p>4X-Large</p> -->
                        </div>
                    </div>
                    <hr class="section__two-filter_line">
                    <div class="section__two-filter_Dress-Style-common">
                        <div class="section__two-filter_Dress-Style">
                            <p>Dress Style</p>
                            <img src="./images/up arrow.svg">
                        </div>
                        <div class="section__two-filter_catalog">
                            <div class="section__two-filter_clothes">
                                <p class="section__two-filter_title">Casual</p>
                                <p>></p>
                            </div>
                            <div class="section__two-filter_clothes">
                                <p class="section__two-filter_title">Formal</p>
                                <p>></p>
                            </div>
                            <div class="section__two-filter_clothes">
                                <p class="section__two-filter_title">Party</p>
                                <p >></p>
                            </div>
                            <div class="section__two-filter_clothes">
                                <p class="section__two-filter_title">Gym</p>
                                <p>></p>
                            </div>
                        </div>
                    </div>
                    <button class="section__two-btns">Apply Filter</button>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
